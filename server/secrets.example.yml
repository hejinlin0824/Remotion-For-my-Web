# ============================================================
# 密钥统一管理 —— 示例文件（本文件可入库，只有占位符）
# 用法：cp secrets.example.yml secrets.local.yml，然后把真实 key 填进 secrets.local.yml
# secrets.local.yml 已被 .gitignore (*.local.yml) 覆盖，绝不入库/绝不外发/绝不打印。
#
# 服务端 Secrets.java 原生识别下面 glm.api-key / tts.api-key 两行（env 优先，本文件兜底）；
# server/start-server.sh 从本文件提取全部条目注入 env（QA 子进程 qa_glm.py 靠 env 继承）。
# 红线：禁止把旧 ANTHROPIC_AUTH_TOKEN（Claude Code 登录凭证）当工厂 key 借道。
# ============================================================

# 智谱 GLM key（生成/审校/审帧）。coding-plan 套餐的 key 必须同时保留 glm.base-url 行，否则稳定 429
glm.api-key: "<你的智谱key>"

# 阿里百炼 DashScope key（TTS，Cherry 音色）
tts.api-key: "<你的百炼key>"

# coding-plan 套餐专用端点；标准 API key 请删除或注释此行
glm.base-url: "https://open.bigmodel.cn/api/coding/paas/v4"
