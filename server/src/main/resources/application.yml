spring:
  datasource:
    url: jdbc:h2:file:./data/jobs;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: update
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
app:
  template-dir: ../template          # 相对 server/ 运行目录；绝对路径可在 secrets.local.yml 覆盖
  workspace-dir: ../workspace
  artifacts-dir: ../artifacts
  public-base-url: http://localhost:8080   # DONE 回调 videoUrl 前缀，反代/域名部署时覆盖
  render:
    timeout-minutes: 30
    concurrency: 2
  glm:
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-5.3-flash             # 占位实现层参数，模型名以 Secrets/prompts 层配置为准
    concurrency: 2
    timeout-seconds: 120
  tts:
    interval-ms: 3000
    cooldown-ms: 15000
    max-attempts-per-line: 3
  qa:
    max-rounds: 5
  retry:
    content-max: 3
