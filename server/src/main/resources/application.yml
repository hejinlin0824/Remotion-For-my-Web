spring:
  datasource:
    url: jdbc:h2:file:./data/jobs;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: update
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
app:
  template-dir: ../template          # 相对 server/ 运行目录；绝对路径可在 secrets.local.yml 覆盖
  workspace-dir: ../workspace
  artifacts-dir: ../artifacts
  public-base-url: http://localhost:8080   # DONE 回调 videoUrl 前缀，反代/域名部署时覆盖
  render:
    timeout-minutes: 30
    concurrency: 2
  glm:
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-5.3-flash             # 占位实现层参数，模型名以 Secrets/prompts 层配置为准
    concurrency: 2
    timeout-seconds: 300             # 健康长生成 ~62s；深夜降级窗口 120s 偏紧（两夜实证），放宽到 300
    max-tokens: 32768                # GLM-5.3 最大输出 128K；thinking 与正文共享预算，8192 时代曾被截断误判"不是 JSON"
  tts:
    interval-ms: 3000
    cooldown-ms: 15000
    max-attempts-per-line: 3
  qa:
    max-rounds: 5
  retry:
    content-max: 3
    gen-deadline-minutes: 30   # T15b②：GENERATING 墙钟死线（进阶段落库 now+值，重试撞线直接判死）
    wall-clock-deadline-minutes: 60   # T21：全局处理墙钟死线（首次进 EXTRACTING 落库 now+值；超线即 FAILED 作废，QUEUED 不计时，回环不刷新）
  cleanup:
    keep-tts-audio: true   # T22：DONE 后保留 TTS 行音频（移动到 artifacts/{jobId}/audio/lines/）；false=工作区整删不保留（旧行为）
